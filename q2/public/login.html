<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <h2>Login</h2>

    <form action="/login" method="post">

        <label>Username:</label>
        <input type="text" name="uname" required>
        <br><br>

        <label>Password:</label>
        <input type="password" name="pass" required>
        <br><br>

        <input type="submit" value="Login">

    </form>

</body>
</html>
